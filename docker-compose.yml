services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: toronto
      POSTGRES_USER: toronto
      POSTGRES_PASSWORD: toronto
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toronto -d toronto"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    env_file: .env.example
    volumes:
      - ./data:/app/data
      - ./dbt:/app/dbt
    depends_on:
      postgres:
        condition: service_healthy

  # Prediction API: http://localhost:8000/docs
  api:
    build: .
    profiles: ["api"]
    entrypoint: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models

  # Optional: full Airflow UI at http://localhost:8080 (user: admin, password printed in logs)
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: ["airflow"]
    command: standalone
    env_file: .env.example
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
