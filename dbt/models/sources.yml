version: 2

sources:
  - name: raw
    schema: raw
    description: Untyped landing tables loaded by pipeline/load.py. One row per source row, all TEXT.
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 2, period: day}
      error_after: {count: 7, period: day}
    tables:
      - name: major_crime_indicators
        description: Toronto Police Service Major Crime Indicators, 2014 to present. One row per offence per event.
      - name: ttc_subway_delays
        description: TTC subway delay log since 2025, from the CKAN datastore.
      - name: neighbourhoods
        description: City of Toronto 158 neighbourhood boundaries (WGS84).
      - name: neighbourhood_profiles
        description: 2021 Census neighbourhood profile, unpivoted to long format (one row per neighbourhood per metric).
